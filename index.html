<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>灵感实验室🪷</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fdfbf7; --card-bg: rgba(255,255,255,0.8); --text-main: #333333;
        --text-sub: #888888; --accent: #fbc531; --danger: #ff6b6b;
        --border: #e8e8e8; --window-border: #a0c4e8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
        margin: 0; 
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; 
        background: var(--bg); 
        background-size: cover; 
        background-position: center; 
        background-attachment: fixed;
        color: var(--text-main); 
        padding-bottom: 80px; 
        overflow-x: hidden; 
        transition: margin-left 0.3s ease; 
    }
    /* 背景遮罩，确保文字可读 */
    body::before {
        content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.4); z-index: -1; pointer-events: none;
    }

    /* ========== 侧边栏 ========== */
    .sidebar {
        position: fixed; top: 0; left: 0; width: 270px; height: 100vh;
        background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
        border-right: 2px solid var(--window-border);
        padding: 20px; overflow-y: auto; z-index: 2000;
        transform: translateX(-100%); transition: transform 0.3s ease;
        box-shadow: 4px 0 15px rgba(0,0,0,0.1);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .sidebar h2 { font-size: 18px; margin: 0; color: #4a6fa5; }
    .close-sidebar { background: none; border: none; font-size: 24px; cursor: pointer; color: #888; }
    
    .tag-list { list-style: none; padding: 0; margin: 0; }
    .tag-list li {
        padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 5px;
        font-size: 15px; color: var(--text-main); transition: 0.2s;
        border: 1px solid transparent;
    }
    .tag-list li:hover { background: #f0f0f0; }
    .tag-list li.active { background: #e8f0fe; color: #4a6fa5; font-weight: bold; border-color: #a0c4e8; }

    /* 遮罩层 */
    .overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.2); z-index: 1500; display: none;
    }
    .overlay.open { display: block; }

    /* ========== 顶部 ========== */
    .top-header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
    .menu-btn { background: rgba(255,255,255,0.8); border: 2px solid var(--window-border); border-radius: 8px; font-size: 20px; cursor: pointer; padding: 5px 12px; color: #4a6fa5; }
    .header-title {
        font-family: 'Dancing Script', 'Brush Script MT', cursive, sans-serif;
        font-size: 32px; color: #4a6fa5; margin: 0; text-shadow: 2px 2px 0 #fff;
    }
    .date-display { font-size: 12px; color: #666; margin: 5px 0 0; text-shadow: 0 0 5px #fff; }

    /* ========== 切换栏（顶部导航条） ========== */
    .nav-tabs {
        display: flex; gap: 8px; padding: 0 15px 10px; flex-wrap: wrap;
    }
    .nav-tab {
        flex: 1; text-align: center; padding: 8px 10px; font-size: 13px;
        background: rgba(255,255,255,0.7); border: 2px solid var(--window-border);
        border-radius: 8px; cursor: pointer; color: #4a6fa5; font-weight: bold;
        transition: 0.2s; min-width: 70px;
    }
    .nav-tab.active { background: #4a6fa5; color: #fff; border-color: #4a6fa5; }

    /* ========== 窗口卡片（半透明窗口风格） ========== */
    .window-card {
        background: var(--card-bg); backdrop-filter: blur(8px);
        margin: 0 15px 15px; padding: 0; border-radius: 0;
        box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        border: 2px solid var(--window-border); position: relative;
    }
    .window-title-bar {
        background: #e8f0fe; border-bottom: 2px solid var(--window-border);
        padding: 6px 12px; font-size: 13px; font-weight: bold; color: #4a6fa5;
        display: flex; justify-content: space-between; align-items: center;
    }
    .window-title-bar .dots { display: flex; gap: 4px; }
    .window-title-bar .dots span { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #4a6fa5; }
    .window-body { padding: 15px; }

    /* 编辑器内部 */
    .editor-card textarea { width: 100%; border: 1px solid var(--border); border-radius: 6px; resize: none; font-size: 15px; font-family: inherit; outline: none; min-height: 80px; color: #333; padding: 10px; background: rgba(255,255,255,0.7); }
    .input-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .input-row input[type="text"] { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; outline: none; background: rgba(255,255,255,0.7); width: 100%; }
    .input-row input[type="file"] { font-size: 12px; width: 100%; }

    .tag-input-row { display: flex; gap: 8px; margin-top: 10px; }
    .tag-input-row input { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; outline: none; background: rgba(255,255,255,0.7); }
    .tag-input-row button { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; }

    .selected-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .selected-tag { background: #e8f0fe; padding: 3px 10px; border-radius: 12px; font-size: 12px; color: #4a6fa5; display: flex; align-items: center; gap: 5px; border: 1px solid #a0c4e8; }
    .selected-tag button { background: none; border: none; color: #999; cursor: pointer; font-size: 14px; }

    .editor-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .btn { border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; background: #4a6fa5; color: #fff; }
    .btn:disabled { opacity: 0.5; }
    .btn-yellow { background: var(--accent); }

    /* 日期与过滤 */
    .date-filter { padding: 0 15px 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .date-filter input[type="date"] { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; background: rgba(255,255,255,0.8); outline: none; color: #333; }
    .date-filter button { background: none; border: none; font-size: 13px; color: #4a6fa5; font-weight: bold; cursor: pointer; text-decoration: underline; }

    /* ========== 笔记列表（窗口卡片） ========== */
    .note-list { padding: 0 15px; display: flex; flex-direction: column; gap: 12px; }
    .note-card {
        background: rgba(255,255,255,0.85); backdrop-filter: blur(5px);
        border: 2px solid var(--window-border); border-radius: 0;
        box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        position: relative;
    }
    .note-card .note-title-bar {
        background: #e8f0fe; border-bottom: 2px solid var(--window-border);
        padding: 5px 10px; font-size: 12px; font-weight: bold; color: #4a6fa5;
        display: flex; justify-content: space-between; align-items: center;
    }
    .note-card .note-body { padding: 12px; }
    .note-date { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .note-tags { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .note-tag { background: #e8f0fe; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #4a6fa5; border: 1px solid #a0c4e8; }
    .note-content { font-size: 15px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 8px; }
    .note-media { max-width: 100%; border-radius: 6px; margin-top: 8px; border: 1px solid var(--border); }
    .note-link { display: inline-block; margin-top: 8px; font-size: 13px; color: #4a6fa5; text-decoration: underline; word-break: break-all; }
    .note-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #ccc; }
    .note-actions button { font-size: 12px; padding: 4px 10px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-danger { background: #ffe0e0; color: var(--danger); }
    .btn-restore { background: #e0f0ff; color: #3b82f6; }

    /* ========== 底部导航栏 ========== */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 2px solid var(--window-border); display: flex; justify-content: space-around; padding: 8px 0 15px; z-index: 1000; }
    .nav-item { text-align: center; font-size: 11px; color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 33%; }
    .nav-item.active { color: #4a6fa5; font-weight: bold; }
    .nav-icon { font-size: 20px; }
    .empty-tip { text-align: center; color: #888; padding: 40px 20px; font-size: 14px; }

    /* ========== 设置弹窗 ========== */
    .settings-modal {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.4); z-index: 3000; display: none;
        justify-content: center; align-items: center; padding: 20px;
    }
    .settings-modal.open { display: flex; }
    .settings-content {
        background: #fff; border: 2px solid var(--window-border); width: 100%; max-width: 400px; padding: 20px;
        box-shadow: 5px 5px 0 rgba(0,0,0,0.2);
    }
    .settings-content h3 { margin: 0 0 15px 0; color: #4a6fa5; font-size: 16px; }
    .settings-content label { font-size: 13px; color: #666; display: block; margin-bottom: 5px; }
    .settings-content input[type="file"] { font-size: 12px; width: 100%; margin-bottom: 15px; }
    .settings-content .btn { width: 100%; margin-top: 5px; }
</style>
</head>
<body>

<!-- 背景遮罩层 -->
<div class="overlay" id="overlay"></div>

<!-- 侧边栏（标签索引） -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2># 标签索引</h2>
        <button class="close-sidebar" id="close-sidebar">×</button>
    </div>
    <ul class="tag-list" id="tag-list">
        <li class="tag-item active" data-tag="all">📚 全部记录</li>
    </ul>
    <div style="margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 15px;">
        <button class="btn" style="width:100%; background:#888; margin-bottom:10px;" onclick="openSettings()">⚙️ 网站设置</button>
        <button class="btn" style="width:100%; background:#ff6b6b;" onclick="logout()">🚪 退出登录</button>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="settings-modal" id="settings-modal">
    <div class="settings-content">
        <h3>⚙️ 网站设置</h3>
        <label>上传自定义背景图（保存到本地浏览器）</label>
        <input type="file" id="bg-upload" accept="image/*">
        <label>背景图片链接（选填，用于分享给他人）</label>
        <input type="text" id="bg-url-input" placeholder="https://example.com/bg.jpg" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-bottom:15px; font-size:13px;">
        <button class="btn" onclick="saveBgFromUrl()">保存背景</button>
        <button class="btn" style="background:#888;" onclick="closeSettings()">关闭</button>
    </div>
</div>

<!-- 顶部 -->
<div class="top-header">
    <button class="menu-btn" id="menu-btn">☰</button>
    <div>
        <h1 class="header-title">灵感实验室🪷</h1>
        <p class="date-display" id="date-display"></p>
    </div>
    <div style="width:50px;"></div>
</div>

<!-- 顶部切换栏 -->
<div class="nav-tabs">
    <div class="nav-tab active" id="tab-notes">📝 笔记</div>
    <div class="nav-tab" id="tab-trash">🗑️ 垃圾桶</div>
    <div class="nav-tab" id="tab-settings">⚙️ 设置</div>
</div>

<!-- 编辑器（窗口卡片风格） -->
<div class="window-card" id="editor-card">
    <div class="window-title-bar">
        <span>📝 new_diary.txt</span>
        <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div class="window-body">
        <textarea id="note-content" placeholder="记录你的灵感和废话吧..."></textarea>
        <div class="input-row">
            <input type="text" id="note-link" placeholder="添加链接（选填）">
        </div>
        <div class="input-row">
            <input type="file" id="note-media" accept="image/*,video/*,.pdf,.doc,.docx,.txt">
            <span id="file-name" style="font-size:12px; color:#4a6fa5;"></span>
        </div>

        <div class="tag-input-row">
            <input type="text" id="tag-input" placeholder="输入标签，回车添加">
            <button id="add-tag-btn">+ 添加</button>
        </div>
        <div class="selected-tags" id="selected-tags"></div>

        <div class="editor-actions">
            <button class="btn btn-yellow" id="save-btn">记录一下 ♡</button>
        </div>
    </div>
</div>

<!-- 日期过滤 -->
<div class="date-filter">
    <input type="date" id="filter-date">
    <button id="clear-date">显示全部</button>
</div>

<!-- 笔记列表 -->
<div class="note-list" id="note-list"></div>

<!-- 底部导航栏 -->
<div class="bottom-nav">
    <div class="nav-item active" id="tab-notes-bottom">
        <span class="nav-icon">📝</span>
        <span>笔记</span>
    </div>
    <div class="nav-item" id="tab-trash-bottom">
        <span class="nav-icon">🗑️</span>
        <span>垃圾桶</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ========== 1. 初始化 Supabase ========== */
const SUPABASE_URL = "https://zpsbdymlofvzyskymagh.supabase.co";
const SUPABASE_KEY = "sb_publishable_6jazDy0kesZQBPSBaY77Rg_qMTM6Hze";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ========== 2. 状态 ========== */
let notes = [];
let currentTag = 'all';
let currentView = 'notes';
let selectedDate = '';
let pendingTags = [];

/* ========== 3. 侧边栏控制 ========== */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
document.getElementById('menu-btn').onclick = openSidebar;
document.getElementById('close-sidebar').onclick = closeSidebar;
overlay.onclick = closeSidebar;

/* ========== 4. 日期显示 ========== */
const today = new Date();
document.getElementById('date-display').textContent = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 星期${'日一二三四五六'[today.getDay()]}`;

/* ========== 5. 背景图设置 ========== */
function loadBackground() {
    const savedBg = localStorage.getItem('customBg');
    if (savedBg) {
        document.body.style.backgroundImage = `url('${savedBg}')`;
    }
}
loadBackground();

function openSettings() {
    document.getElementById('settings-modal').classList.add('open');
    document.getElementById('bg-url-input').value = localStorage.getItem('customBg') || '';
}
function closeSettings() {
    document.getElementById('settings-modal').classList.remove('open');
}

document.getElementById('bg-upload').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const base64 = ev.target.result;
        localStorage.setItem('customBg', base64);
        document.body.style.backgroundImage = `url('${base64}')`;
        alert("背景已保存到本地！注意：本地图片无法分享给他人，如果需要分享，请把图片上传到图床并把链接填入下方。");
    };
    reader.readAsDataURL(file);
};

function saveBgFromUrl() {
    const url = document.getElementById('bg-url-input').value.trim();
    if (url) {
        localStorage.setItem('customBg', url);
        document.body.style.backgroundImage = `url('${url}')`;
        alert("背景已保存！");
        closeSettings();
    } else {
        alert("请输入图片链接");
    }
}

/* ========== 6. 标签输入逻辑 ========== */
function renderPendingTags() {
    const box = document.getElementById('selected-tags');
    box.innerHTML = pendingTags.map((t, i) => `
        <span class="selected-tag">${escapeHTML(t)} <button onclick="removePendingTag(${i})">×</button></span>
    `).join("");
}
function removePendingTag(index) {
    pendingTags.splice(index, 1);
    renderPendingTags();
}
function addPendingTag() {
    const input = document.getElementById('tag-input');
    const tag = input.value.trim();
    if (tag && !pendingTags.includes(tag)) {
        pendingTags.push(tag);
        renderPendingTags();
    }
    input.value = '';
}
document.getElementById('add-tag-btn').onclick = addPendingTag;
document.getElementById('tag-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addPendingTag(); }
});

/* ========== 7. 文件选择提示 ========== */
document.getElementById('note-media').onchange = (e) => {
    const file = e.target.files[0];
    if (file) document.getElementById('file-name').textContent = file.name;
};

/* ========== 8. 视图切换 ========== */
function switchView(view) {
    currentView = view;
    if (view === 'notes') {
        document.getElementById('tab-notes').classList.add('active');
        document.getElementById('tab-trash').classList.remove('active');
        document.getElementById('tab-settings').classList.remove('active');
        document.getElementById('editor-card').style.display = 'block';
        document.querySelector('.date-filter').style.display = 'flex';
    } else if (view === 'trash') {
        document.getElementById('tab-notes').classList.remove('active');
        document.getElementById('tab-trash').classList.add('active');
        document.getElementById('tab-settings').classList.remove('active');
        document.getElementById('editor-card').style.display = 'none';
        document.querySelector('.date-filter').style.display = 'none';
    } else if (view === 'settings') {
        document.getElementById('tab-notes').classList.remove('active');
        document.getElementById('tab-trash').classList.remove('active');
        document.getElementById('tab-settings').classList.add('active');
        document.getElementById('editor-card').style.display = 'none';
        document.querySelector('.date-filter').style.display = 'none';
        openSettings();
        return;
    }
    renderNotes();
}

document.getElementById('tab-notes').onclick = () => switchView('notes');
document.getElementById('tab-trash').onclick = () => switchView('trash');
document.getElementById('tab-settings').onclick = () => switchView('settings');

// 底部导航栏（兼容）
document.getElementById('tab-notes-bottom').onclick = () => switchView('notes');
document.getElementById('tab-trash-bottom').onclick = () => switchView('trash');

/* ========== 9. 日期过滤 ========== */
document.getElementById('filter-date').onchange = (e) => {
    selectedDate = e.target.value;
    renderNotes();
};
document.getElementById('clear-date').onclick = () => {
    document.getElementById('filter-date').value = '';
    selectedDate = '';
    renderNotes();
};

/* ========== 10. 加载与渲染 ========== */
async function loadNotes() {
    const { data, error } = await supabaseClient
        .from('notes')
        .select('*')
        .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    notes = data || [];
    renderSidebarTags();
    renderNotes();
}

function renderSidebarTags() {
    const list = document.getElementById('tag-list');
    const allTags = new Set();
    notes.forEach(n => {
        if (n.tags && !n.deleted) {
            n.tags.split(',').forEach(t => allTags.add(t.trim()));
        }
    });

    let html = `<li class="tag-item ${currentTag === 'all' ? 'active' : ''}" data-tag="all">📚 全部记录</li>`;
    allTags.forEach(tag => {
        html += `<li class="tag-item ${currentTag === tag ? 'active' : ''}" data-tag="${tag}">🏷️ ${escapeHTML(tag)}</li>`;
    });
    list.innerHTML = html;

    document.querySelectorAll('.tag-item').forEach(item => {
        item.onclick = () => {
            currentTag = item.dataset.tag;
            renderSidebarTags();
            renderNotes();
            closeSidebar();
        };
    });
}

function renderNotes() {
    const list = document.getElementById('note-list');
    let filtered = notes.filter(n => n.deleted === (currentView === 'trash'));

    if (selectedDate) filtered = filtered.filter(n => n.date === selectedDate);

    if (currentTag !== 'all') {
        filtered = filtered.filter(n => n.tags && n.tags.split(',').map(t => t.trim()).includes(currentTag));
    }

    if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-tip">${currentView === 'notes' ? '还没有记录哦，快写点废话吧 ♡' : '垃圾桶是空的 🗑️'}</div>`;
        return;
    }

    list.innerHTML = filtered.map(n => {
        let mediaHtml = '';
        if (n.media_url) {
            if (n.media_type === 'image') mediaHtml = `<img src="${n.media_url}" class="note-media" />`;
            else if (n.media_type === 'video') mediaHtml = `<video src="${n.media_url}" controls class="note-media"></video>`;
            else mediaHtml = `<a href="${n.media_url}" target="_blank" class="note-link">📎 查看附件：${escapeHTML(n.media_url.split('/').pop())}</a>`;
        }
        let linkHtml = n.link_url ? `<a href="${n.link_url}" target="_blank" class="note-link">🔗 ${escapeHTML(n.link_url)}</a>` : '';

        return `
            <div class="note-card">
                <div class="note-title-bar">
                    <span>📄 ${escapeHTML(n.title || '未命名笔记')}</span>
                    <div class="dots"><span></span><span></span><span></span></div>
                </div>
                <div class="note-body">
                    <div class="note-date">
                        <span>📅 ${n.date}</span>
                        <span>${new Date(n.created_at).toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="note-tags">
                        ${n.tags ? n.tags.split(',').map(t => `<span class="note-tag">#${escapeHTML(t.trim())}</span>`).join('') : ''}
                    </div>
                    <div class="note-content">${escapeHTML(n.content)}</div>
                    ${mediaHtml}
                    ${linkHtml}
                    <div class="note-actions">
                        ${currentView === 'notes' 
                            ? `<button class="btn-danger" onclick="moveToTrash('${n.id}')">移入垃圾桶</button>`
                            : `<button class="btn-restore" onclick="restoreNote('${n.id}')">恢复</button>
                               <button class="btn-danger" onclick="deletePermanently('${n.id}')">彻底删除</button>`
                        }
                    </div>
                </div>
            </div>
        `;
    }).join("");
}

function escapeHTML(text) {
    return String(text || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ========== 11. 保存笔记 ========== */
document.getElementById('save-btn').onclick = async function() {
    const content = document.getElementById('note-content').value.trim();
    const link = document.getElementById('note-link').value.trim();
    const fileInput = document.getElementById('note-media');
    const file = fileInput.files[0];

    if (!content && !file && !link) return alert("写点什么或者加个文件吧 ♡");

    this.disabled = true;
    this.textContent = "保存中...";

    let mediaUrl = null, mediaType = null;
    if (file) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { error: uploadError } = await supabaseClient.storage.from('note-media').upload(fileName, file);
        if (uploadError) {
            alert("文件上传失败：" + uploadError.message);
            this.disabled = false; this.textContent = "记录一下 ♡";
            return;
        }
        const { data: urlData } = supabaseClient.storage.from('note-media').getPublicUrl(fileName);
        mediaUrl = urlData.publicUrl;
        if (file.type.startsWith('image/')) mediaType = 'image';
        else if (file.type.startsWith('video/')) mediaType = 'video';
        else mediaType = 'file';
    }

    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const tagsStr = pendingTags.join(',');
    // 用内容的前15个字作为标题，方便窗口显示
    const title = content.substring(0, 15) + (content.length > 15 ? '...' : '');

    const { error } = await supabaseClient.from('notes').insert({
        id: Date.now().toString(36),
        date: dateStr,
        content: content,
        media_url: mediaUrl,
        media_type: mediaType,
        link_url: link,
        tags: tagsStr,
        title: title,
        deleted: false
    });

    if (error) {
        alert("保存失败：" + error.message);
    } else {
        document.getElementById('note-content').value = '';
        document.getElementById('note-link').value = '';
        fileInput.value = '';
        document.getElementById('file-name').textContent = '';
        pendingTags = [];
        renderPendingTags();
        await loadNotes();
    }
    this.disabled = false;
    this.textContent = "记录一下 ♡";
};

/* ========== 12. 删除与恢复 ========== */
async function moveToTrash(id) {
    if (!confirm("移入垃圾桶？")) return;
    await supabaseClient.from('notes').update({ deleted: true }).eq('id', id);
    await loadNotes();
}
async function restoreNote(id) {
    await supabaseClient.from('notes').update({ deleted: false }).eq('id', id);
    await loadNotes();
}
async function deletePermanently(id) {
    if (!confirm("彻底删除？不可恢复！")) return;
    await supabaseClient.from('notes').delete().eq('id', id);
    await loadNotes();
}

/* ========== 初始化 ========== */
loadNotes();
</script>
