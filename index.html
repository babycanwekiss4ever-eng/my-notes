<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rainy Day</title>
<style>
    :root {
        --font-main: "SimHei", "Heiti SC", "Microsoft YaHei", "PingFang SC", sans-serif;
        /* 雨天氛围配色：雾面灰蓝 */
        --bg-color: #eef2f5;
        --text-main: #2c3e50;
        --text-sub: #7f8c8d;
        --accent: #8fa8b8;
        --card-bg: rgba(255, 255, 255, 0.6);
        --border-light: rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        margin: 0;
        font-family: var(--font-main);
        background-color: var(--bg-color);
        color: var(--text-main);
        padding-bottom: 40px;
        overflow-x: hidden;
        line-height: 1.7;
        /* 雨天微妙的背景光晕 */
        background-image:
            radial-gradient(circle at 20% 10%, rgba(200, 210, 220, 0.4), transparent 40%),
            radial-gradient(circle at 80% 90%, rgba(180, 190, 200, 0.3), transparent 50%);
        background-attachment: fixed;
    }

    /* 雨天雾面遮罩 */
    body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(238, 242, 245, 0.2);
        backdrop-filter: blur(2px);
        z-index: -1;
        pointer-events: none;
    }

    /* ========== 顶部极简头部 ========== */
    .top-header {
        padding: 60px 25px 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }
    .header-title {
        font-size: 34px;
        color: var(--text-main);
        margin: 0;
        font-weight: 200;
        letter-spacing: 6px;
        font-family: var(--font-main);
    }
    .date-display {
        font-size: 12px;
        color: var(--text-sub);
        margin: 12px 0 0;
        letter-spacing: 3px;
    }

    /* 顶部导航（极简文字风格） */
    .nav-tabs {
        display: flex;
        gap: 30px;
        padding: 0 25px 30px;
        justify-content: center;
    }
    .nav-tab {
        font-size: 14px;
        color: var(--text-sub);
        cursor: pointer;
        background: none;
        border: none;
        font-family: var(--font-main);
        padding: 6px 0;
        position: relative;
        transition: color 0.3s;
        letter-spacing: 1px;
    }
    .nav-tab::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; width: 0; height: 1px;
        background: var(--accent);
        transition: width 0.3s;
    }
    .nav-tab.active {
        color: var(--text-main);
        font-weight: 500;
    }
    .nav-tab.active::after {
        width: 100%;
    }
    .nav-tab:hover { color: var(--text-main); }

    /* ========== 卡片 ========== */
    .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        margin: 0 25px 25px;
        padding: 28px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03);
        position: relative;
        transition: box-shadow 0.3s;
    }
    .glass-card:hover {
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }

    .card-label {
        font-size: 11px;
        color: var(--text-sub);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-light);
    }

    /* 输入区 */
    .glass-card textarea {
        width: 100%;
        border: none;
        resize: none;
        font-size: 15px;
        font-family: var(--font-main);
        outline: none;
        min-height: 90px;
        color: var(--text-main);
        padding: 0;
        background: transparent;
        line-height: 1.7;
    }
    .glass-card textarea::placeholder { color: #b0b8bf; }

    .input-row {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        align-items: center;
        flex-wrap: wrap;
    }
    .input-row input[type="text"] {
        flex: 1;
        border: none;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        padding: 8px 0;
        font-size: 13px;
        outline: none;
        background: transparent;
        color: var(--text-sub);
        font-family: var(--font-main);
        transition: border-color 0.3s;
    }
    .input-row input[type="text"]:focus {
        border-bottom-color: var(--accent);
    }
    .input-row input[type="file"] {
        font-size: 12px;
        color: var(--text-sub);
        width: 100%;
    }

    /* 标签输入 */
    .tag-input-row {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        align-items: flex-end;
    }
    .tag-input-row input {
        flex: 1;
        border: none;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        padding: 8px 0;
        font-size: 13px;
        outline: none;
        background: transparent;
        color: var(--text-sub);
        font-family: var(--font-main);
        transition: border-color 0.3s;
    }
    .tag-input-row input:focus {
        border-bottom-color: var(--accent);
    }
    .tag-input-row button {
        background: none;
        border: 1px solid var(--accent);
        color: var(--accent);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        font-family: var(--font-main);
        transition: all 0.3s;
        white-space: nowrap;
    }
    .tag-input-row button:hover {
        background: var(--accent);
        color: #fff;
    }

    .selected-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 15px;
    }
    .selected-tag {
        background: rgba(143, 168, 184, 0.12);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .selected-tag button {
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 14px;
        padding: 0;
        line-height: 1;
    }

    /* 操作按钮 */
    .editor-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 25px;
    }
    .btn {
        border: none;
        padding: 10px 28px;
        border-radius: 24px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s;
        background: var(--accent);
        color: #fff;
        font-family: var(--font-main);
        letter-spacing: 1px;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; }
    .btn-outline {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
    }
    .btn-outline:hover {
        background: var(--accent);
        color: #fff;
    }

    /* 日期过滤 */
    .date-filter {
        padding: 0 25px 25px;
        display: flex;
        align-items: center;
        gap: 15px;
        justify-content: center;
    }
    .date-filter input[type="date"] {
        border: none;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        padding: 8px 0;
        font-size: 13px;
        font-family: var(--font-main);
        background: transparent;
        outline: none;
        color: var(--text-sub);
    }
    .date-filter button {
        background: none;
        border: none;
        font-size: 13px;
        color: var(--accent);
        cursor: pointer;
        font-family: var(--font-main);
    }

    /* ========== 侧边栏 ========== */
    .sidebar {
        position: fixed;
        top: 0; left: 0;
        width: 280px;
        height: 100vh;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-right: 1px solid rgba(255, 255, 255, 0.5);
        padding: 40px 25px;
        overflow-y: auto;
        z-index: 2000;
        transform: translateX(-100%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 4px 0 30px rgba(0, 0, 0, 0.04);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
    }
    .sidebar h2 {
        font-size: 14px;
        margin: 0;
        font-weight: 400;
        color: var(--text-sub);
        letter-spacing: 3px;
    }
    .close-sidebar {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #ccc;
        padding: 0;
        line-height: 1;
    }

    /* 头像 */
    .avatar-wrapper {
        text-align: center;
        margin-bottom: 35px;
    }
    .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(143, 168, 184, 0.08);
        border: 1px dashed var(--accent);
        cursor: pointer;
        overflow: hidden;
        position: relative;
        transition: all 0.3s;
    }
    .avatar:hover {
        background: rgba(143, 168, 184, 0.15);
        border-style: solid;
    }
    .avatar-inner { width: 100%; height: 100%; object-fit: cover; display: none; }
    .avatar-text { color: #b0b8bf; font-size: 11px; }
    .avatar-upload { display: none; }

    /* 标签列表 */
    .tag-list { list-style: none; padding: 0; margin: 0; }
    .tag-list li {
        padding: 12px 10px;
        margin-bottom: 4px;
        font-size: 14px;
        color: var(--text-sub);
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .tag-list li:hover {
        background: rgba(143, 168, 184, 0.08);
        color: var(--text-main);
    }
    .tag-list li.active {
        background: rgba(143, 168, 184, 0.12);
        color: var(--text-main);
        font-weight: 500;
    }

    /* 日期索引 */
    .date-index-section { margin-top: 30px; }
    .date-index-section h3 {
        font-size: 11px;
        color: var(--text-sub);
        margin-bottom: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    .date-picker-input {
        width: 100%;
        padding: 10px 0;
        border: none;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        font-family: var(--font-main);
        font-size: 13px;
        outline: none;
        background: transparent;
        color: var(--text-sub);
    }

    /* 遮罩层 */
    .overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(4px);
        z-index: 1500;
        display: none;
        opacity: 0;
        transition: opacity 0.3s;
    }
    .overlay.open { display: block; opacity: 1; }

    /* ========== 笔记列表 ========== */
    .note-list {
        padding: 0 25px;
        display: flex;
        flex-direction: column;
        gap: 18px;
    }
    .note-card {
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.02);
        transition: box-shadow 0.3s;
    }
    .note-card:hover {
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.04);
    }
    .note-date {
        font-size: 11px;
        color: #b0b8bf;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        letter-spacing: 0.5px;
    }
    .note-tags {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }
    .note-tag {
        background: rgba(143, 168, 184, 0.1);
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 11px;
        color: var(--accent);
    }
    .note-content {
        font-size: 15px;
        line-height: 1.8;
        white-space: pre-wrap;
        margin-bottom: 12px;
        color: var(--text-main);
        font-family: var(--font-main);
    }
    .note-media {
        max-width: 100%;
        border-radius: 10px;
        margin-top: 12px;
        border: 1px solid var(--border-light);
    }
    .note-link {
        display: inline-block;
        margin-top: 10px;
        font-size: 13px;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
        word-break: break-all;
    }
    .note-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--border-light);
    }
    .note-actions button {
        font-size: 12px;
        padding: 6px 18px;
        border-radius: 16px;
        border: none;
        cursor: pointer;
        transition: all 0.3s;
        font-family: var(--font-main);
        background: transparent;
        color: var(--text-sub);
        border: 1px solid var(--border-light);
    }
    .note-actions button:hover {
        background: rgba(143, 168, 184, 0.08);
        color: var(--text-main);
    }
    .btn-danger {
        color: #e74c3c !important;
        border-color: rgba(231, 76, 60, 0.2) !important;
    }
    .btn-danger:hover {
        background: rgba(231, 76, 60, 0.06) !important;
    }

    /* 空状态 */
    .empty-tip {
        text-align: center;
        color: #b0b8bf;
        padding: 60px 20px;
        font-size: 14px;
        letter-spacing: 1px;
    }

    /* ========== 设置弹窗 ========== */
    .settings-modal {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(6px);
        z-index: 3000;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .settings-modal.open { display: flex; }
    .settings-content {
        background: rgba(255, 255, 255, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        width: 100%;
        max-width: 380px;
        padding: 35px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
    }
    .settings-content h3 {
        margin: 0 0 25px;
        color: var(--text-main);
        font-size: 16px;
        font-weight: 400;
        letter-spacing: 2px;
    }
    .settings-content label {
        font-size: 12px;
        color: var(--text-sub);
        display: block;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }
    .settings-content input[type="file"] {
        font-size: 12px;
        width: 100%;
        margin-bottom: 22px;
        color: var(--text-sub);
    }
    .settings-content input[type="text"] {
        width: 100%;
        padding: 10px 0;
        border: none;
        border-bottom: 1px solid var(--border-light);
        border-radius: 0;
        margin-bottom: 22px;
        font-size: 13px;
        outline: none;
        background: transparent;
        font-family: var(--font-main);
        color: var(--text-sub);
    }
    .settings-content .btn {
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        font-size: 13px;
    }
    .settings-content .btn-grey {
        background: transparent;
        color: var(--text-sub);
        border: 1px solid var(--border-light);
    }
    .settings-content .btn-grey:hover {
        background: rgba(0, 0, 0, 0.03);
        color: var(--text-main);
    }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<!-- 侧边栏 -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>INDEX</h2>
        <button class="close-sidebar" id="close-sidebar">×</button>
    </div>

    <div class="avatar-wrapper">
        <div class="avatar" id="avatar-img" onclick="document.getElementById('avatar-upload').click()">
            <img src="" alt="" class="avatar-inner" id="avatar-inner">
            <span class="avatar-text" id="avatar-text">上传</span>
        </div>
        <input type="file" id="avatar-upload" class="avatar-upload" accept="image/*">
    </div>

    <ul class="tag-list" id="tag-list"></ul>

    <div class="date-index-section">
        <h3>📅 日期索引</h3>
        <input type="date" class="date-picker-input" id="sidebar-date-picker">
    </div>

    <div style="margin-top: 35px; border-top: 1px solid var(--border-light); padding-top: 20px;">
        <button class="btn btn-grey" style="width:100%;" onclick="openSettings()">⚙️ 设置</button>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="settings-modal" id="settings-modal">
    <div class="settings-content">
        <h3>⚙️ 设置</h3>
        <label>上传自定义背景图</label>
        <input type="file" id="bg-upload" accept="image/*">
        <label>背景图片链接</label>
        <input type="text" id="bg-url-input" placeholder="https://example.com/bg.jpg">
        <button class="btn" onclick="saveBgFromUrl()">保存背景</button>
        <button class="btn btn-grey" onclick="resetBackground()">恢复默认背景</button>
        <button class="btn btn-grey" onclick="closeSettings()">关闭</button>
    </div>
</div>

<!-- 顶部 -->
<div class="top-header">
    <button class="menu-btn" id="menu-btn" style="position: absolute; left: 25px; top: 55px; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-sub);">☰</button>
    <h1 class="header-title">Rainy Day</h1>
    <p class="date-display" id="date-display"></p>
</div>

<!-- 切换栏 -->
<div class="nav-tabs">
    <div class="nav-tab active" id="tab-notes">笔记</div>
    <div class="nav-tab" id="tab-trash">垃圾桶</div>
    <div class="nav-tab" id="tab-settings">设置</div>
</div>

<!-- 编辑器 -->
<div class="glass-card" id="editor-card">
    <div class="card-label">NEW ENTRY</div>
    <textarea id="note-content" placeholder="今天下雨了，有什么想写的吗..."></textarea>
    <div class="input-row">
        <input type="text" id="note-link" placeholder="添加链接（选填）">
    </div>
    <div class="input-row">
        <input type="file" id="note-media" accept="image/*,video/*,.pdf,.doc,.docx,.txt">
        <span id="file-name" style="font-size:12px; color:var(--text-sub);"></span>
    </div>
    <div class="tag-input-row">
        <input type="text" id="tag-input" placeholder="输入标签，回车添加">
        <button id="add-tag-btn">添加</button>
    </div>
    <div class="selected-tags" id="selected-tags"></div>
    <div class="editor-actions">
        <button class="btn" id="save-btn">记录一下 ♡</button>
    </div>
</div>

<!-- 日期过滤 -->
<div class="date-filter">
    <input type="date" id="filter-date">
    <button id="clear-date">显示全部</button>
</div>

<!-- 笔记列表 -->
<div class="note-list" id="note-list"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= 1. Supabase 初始化 ================= */
const SUPABASE_URL = "https://zpsbdymlofvzyskymagh.supabase.co";
const SUPABASE_KEY = "sb_publishable_6jazDy0kesZQBPSBaY77Rg_qMTM6Hze";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= 2. 状态变量 ================= */
let notes = [];
let currentTag = 'all';
let currentView = 'notes';
let selectedDate = '';
let pendingTags = [];

/* ================= 3. 侧边栏逻辑 ================= */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
document.getElementById('menu-btn').onclick = openSidebar;
document.getElementById('close-sidebar').onclick = closeSidebar;
overlay.onclick = closeSidebar;

// 用户头像上传
document.getElementById('avatar-upload').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById('avatar-inner').src = ev.target.result;
            document.getElementById('avatar-inner').style.display = 'block';
            document.getElementById('avatar-text').style.display = 'none';
            localStorage.setItem('userAvatar', ev.target.result);
        };
        reader.readAsDataURL(file);
    }
};
const savedAvatar = localStorage.getItem('userAvatar');
if (savedAvatar) {
    document.getElementById('avatar-inner').src = savedAvatar;
    document.getElementById('avatar-inner').style.display = 'block';
    document.getElementById('avatar-text').style.display = 'none';
}

// 日期显示
const today = new Date();
document.getElementById('date-display').textContent = `${today.getFullYear()} / ${today.getMonth()+1} / ${today.getDate()}`;

/* ================= 4. 背景设置与恢复默认 ================= */
function loadBackground() {
    const savedBg = localStorage.getItem('customBg');
    if (savedBg) {
        document.body.style.backgroundImage = `url('${savedBg}')`;
    }
}
loadBackground();

function openSettings() { document.getElementById('settings-modal').classList.add('open'); document.getElementById('bg-url-input').value = localStorage.getItem('customBg') || ''; }
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }

document.getElementById('bg-upload').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const base64 = ev.target.result;
        localStorage.setItem('customBg', base64);
        document.body.style.backgroundImage = `url('${base64}')`;
        alert("背景已保存到本地！");
    };
    reader.readAsDataURL(file);
};

function saveBgFromUrl() {
    const url = document.getElementById('bg-url-input').value.trim();
    if (url) { localStorage.setItem('customBg', url); document.body.style.backgroundImage = `url('${url}')`; alert("背景已保存！"); closeSettings(); }
    else { alert("请输入图片链接"); }
}

function resetBackground() {
    localStorage.removeItem('customBg');
    document.body.style.backgroundImage = '';
    alert("已恢复为系统默认背景！");
    closeSettings();
}

/* ================= 5. 标签与视图切换逻辑 ================= */
function renderPendingTags() {
    const box = document.getElementById('selected-tags');
    box.innerHTML = pendingTags.map((t, i) => `<span class="selected-tag">${escapeHTML(t)} <button onclick="removePendingTag(${i})">×</button></span>`).join("");
}
function removePendingTag(index) { pendingTags.splice(index, 1); renderPendingTags(); }
function addPendingTag() {
    const input = document.getElementById('tag-input');
    const tag = input.value.trim();
    if (tag && !pendingTags.includes(tag)) { pendingTags.push(tag); renderPendingTags(); }
    input.value = '';
}
document.getElementById('add-tag-btn').onclick = addPendingTag;
document.getElementById('tag-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addPendingTag(); } });

document.getElementById('note-media').onchange = (e) => {
    const file = e.target.files[0];
    if (file) document.getElementById('file-name').textContent = file.name;
};

function switchView(view) {
    currentView = view;
    if (view === 'notes') {
        document.getElementById('tab-notes').classList.add('active');
        document.getElementById('tab-trash').classList.remove('active');
        document.getElementById('tab-settings').classList.remove('active');
        document.getElementById('editor-card').style.display = 'block';
        document.querySelector('.date-filter').style.display = 'flex';
    } else if (view === 'trash') {
        document.getElementById('tab-notes').classList.remove('active');
        document.getElementById('tab-trash').classList.add('active');
        document.getElementById('tab-settings').classList.remove('active');
        document.getElementById('editor-card').style.display = 'none';
        document.querySelector('.date-filter').style.display = 'none';
    } else if (view === 'settings') {
        document.getElementById('tab-notes').classList.remove('active');
        document.getElementById('tab-trash').classList.remove('active');
        document.getElementById('tab-settings').classList.add('active');
        document.getElementById('editor-card').style.display = 'none';
        document.querySelector('.date-filter').style.display = 'none';
        openSettings();
        return;
    }
    renderNotes();
}
document.getElementById('tab-notes').onclick = () => switchView('notes');
document.getElementById('tab-trash').onclick = () => switchView('trash');
document.getElementById('tab-settings').onclick = () => switchView('settings');

// 日期过滤
document.getElementById('filter-date').onchange = (e) => { selectedDate = e.target.value; renderNotes(); };
document.getElementById('clear-date').onclick = () => { document.getElementById('filter-date').value = ''; selectedDate = ''; renderNotes(); };
document.getElementById('sidebar-date-picker').onchange = (e) => {
    selectedDate = e.target.value;
    document.getElementById('filter-date').value = selectedDate;
    renderNotes();
    closeSidebar();
};

/* ================= 6. 数据加载与渲染 ================= */
async function loadNotes() {
    const { data, error } = await supabaseClient.from('notes').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    notes = data || [];
    renderSidebarTags();
    renderNotes();
}

function renderSidebarTags() {
    const list = document.getElementById('tag-list');
    const allTags = new Set();
    notes.forEach(n => { if (n.tags && !n.deleted) n.tags.split(',').forEach(t => allTags.add(t.trim())); });

    let html = `<li class="tag-item ${currentTag === 'all' ? 'active' : ''}" data-tag="all"><span>📚 全部记录</span></li>`;
    allTags.forEach(tag => {
        html += `<li class="tag-item ${currentTag === tag ? 'active' : ''}" data-tag="${tag}"><span>🏷️ ${escapeHTML(tag)}</span></li>`;
    });
    list.innerHTML = html;

    document.querySelectorAll('.tag-item').forEach(item => {
        item.onclick = () => { currentTag = item.dataset.tag; renderSidebarTags(); renderNotes(); closeSidebar(); };
    });
}

function renderNotes() {
    const list = document.getElementById('note-list');
    let filtered = notes.filter(n => n.deleted === (currentView === 'trash'));
    if (selectedDate) filtered = filtered.filter(n => n.date === selectedDate);
    if (currentTag !== 'all') filtered = filtered.filter(n => n.tags && n.tags.split(',').map(t => t.trim()).includes(currentTag));

    if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-tip">${currentView === 'notes' ? '这里空空的，写点什么吧 ♡' : '垃圾桶是空的 🗑️'}</div>`;
        return;
    }

    list.innerHTML = filtered.map(n => {
        let mediaHtml = '';
        if (n.media_url) {
            if (n.media_type === 'image') mediaHtml = `<img src="${n.media_url}" class="note-media" />`;
            else if (n.media_type === 'video') mediaHtml = `<video src="${n.media_url}" controls class="note-media"></video>`;
            else mediaHtml = `<a href="${n.media_url}" target="_blank" class="note-link">📎 查看附件：${escapeHTML(n.media_url.split('/').pop())}</a>`;
        }
        let linkHtml = n.link_url ? `<a href="${n.link_url}" target="_blank" class="note-link">🔗 ${escapeHTML(n.link_url)}</a>` : '';

        return `
            <div class="note-card">
                <div class="note-date">
                    <span>📅 ${n.date}</span>
                    <span>${new Date(n.created_at).toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'})}</span>
                </div>
                <div class="note-tags">
                    ${n.tags ? n.tags.split(',').map(t => `<span class="note-tag">#${escapeHTML(t.trim())}</span>`).join('') : ''}
                </div>
                <div class="note-content">${escapeHTML(n.content)}</div>
                ${mediaHtml}
                ${linkHtml}
                <div class="note-actions">
                    ${currentView === 'notes'
                        ? `<button class="btn-danger" onclick="moveToTrash('${n.id}')">移入垃圾桶</button>`
                        : `<button onclick="restoreNote('${n.id}')">恢复</button>
                           <button class="btn-danger" onclick="deletePermanently('${n.id}')">彻底删除</button>`
                    }
                </div>
            </div>
        `;
    }).join("");
}

function escapeHTML(text) { return String(text || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================= 7. 保存与删除逻辑 ================= */
document.getElementById('save-btn').onclick = async function() {
    const content = document.getElementById('note-content').value.trim();
    const link = document.getElementById('note-link').value.trim();
    const fileInput = document.getElementById('note-media');
    const file = fileInput.files[0];

    if (!content && !file && !link) return alert("写点什么或者加个文件吧 ♡");

    this.disabled = true; this.textContent = "保存中...";

    let mediaUrl = null, mediaType = null;
    if (file) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { error: uploadError } = await supabaseClient.storage.from('note-media').upload(fileName, file);
        if (uploadError) { alert("文件上传失败：" + uploadError.message); this.disabled = false; this.textContent = "记录一下 ♡"; return; }
        const { data: urlData } = supabaseClient.storage.from('note-media').getPublicUrl(fileName);
        mediaUrl = urlData.publicUrl;
        if (file.type.startsWith('image/')) mediaType = 'image';
        else if (file.type.startsWith('video/')) mediaType = 'video';
        else mediaType = 'file';
    }

    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const tagsStr = pendingTags.join(',');
    const title = content.substring(0, 15) + (content.length > 15 ? '...' : '');

    const { error } = await supabaseClient.from('notes').insert({
        id: Date.now().toString(36), date: dateStr, content: content,
        media_url: mediaUrl, media_type: mediaType, link_url: link,
        tags: tagsStr, title: title, deleted: false
    });

    if (error) { alert("保存失败：" + error.message); }
    else {
        document.getElementById('note-content').value = '';
        document.getElementById('note-link').value = '';
        fileInput.value = '';
        document.getElementById('file-name').textContent = '';
        pendingTags = []; renderPendingTags();
        await loadNotes();
    }
    this.disabled = false; this.textContent = "记录一下 ♡";
};

async function moveToTrash(id) { if (!confirm("移入垃圾桶？")) return; await supabaseClient.from('notes').update({ deleted: true }).eq('id', id); await loadNotes(); }
async function restoreNote(id) { await supabaseClient.from('notes').update({ deleted: false }).eq('id', id); await loadNotes(); }
async function deletePermanently(id) { if (!confirm("彻底删除？不可恢复！")) return; await supabaseClient.from('notes').delete().eq('id', id); await loadNotes(); }

/* ================= 初始化 ================= */
loadNotes();
</script>
