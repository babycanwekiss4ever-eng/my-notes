<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Malb♡r☆</title>
<style>
    /* ================= 全局变量与基础 ================= */
    :root {
        --font-main: "SimHei", "Heiti SC", "Microsoft YaHei", "PingFang SC", sans-serif;
        
        /* 背景图（电脑端） */
        --bg-day: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/bg-day-pc.png');
        --bg-night: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/bg-night-pc.png');
        /* 手机端壁纸 */
        --bg-day-mobile: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/bg-day-mobile.png');
        --bg-night-mobile: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/bg-night-mobile.png');
        
        /* 装饰图片链接 */
        --deco-img: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/deco.png');
        --title-bg-img: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/title-bg.png');
        --trash-bg: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/trash-bg.png');

        /* 卡片图片链接 */
        --card-text-short: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/card-text-short.png');
        --card-text-long: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/card-text-long.png');
        --card-text-big: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/card-text-big.png');
        --card-img-1: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/card-img-1.png');
        --card-img-3: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/card-img-3.png');
        --card-img-6: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/card-img-6.png');
        --card-img-only: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/card-img-only.png');

        /* 按钮图片链接 */
        --btn-blank: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/btn-blank.png');
        --btn-blue: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/btn-blue.png');
        --btn-grey: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/btn-grey.png');
        --btn-no: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/btn-no.png');
        --btn-pink: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/btn-pink.png');
        --btn-yes: url('https://zpsbdymlofvzyskymagh.supabase.co/storage/v1/object/public/assets/btn-yes.png');

        --text-main: #333;
        --text-sub: #666;
        --accent: #f8c8d4;
        --border-radius: 16px;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* 核心：电脑端默认使用电脑背景图 */
    body { 
        margin: 0; 
        font-family: var(--font-main);
        background-color: #fdfbf7;
        background-image: var(--bg-day);
        background-size: cover; 
        background-position: center; 
        background-attachment: fixed;
        color: var(--text-main); 
        padding-bottom: 30px; /* 移除了底部导航栏，减少底部留白 */
        overflow-x: hidden; 
        transition: background-image 0.4s ease; 
        line-height: 1.6;
    }
    body::before {
        content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.3); z-index: -1; pointer-events: none;
    }

    /* 深色模式切换 */
    @media (prefers-color-scheme: dark) {
        body { background-image: var(--bg-night); }
        body::before { background: rgba(0,0,0,0.4); }
    }
    /* 手机端尺寸切换为手机壁纸 */
    @media (max-width: 768px) {
        body { background-image: var(--bg-day-mobile); }
        @media (prefers-color-scheme: dark) {
            body { background-image: var(--bg-night-mobile); }
        }
    }

    /* ================= 顶部（标题居中，点击可设置） ================= */
    .top-header { 
        padding: 20px 15px 10px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        position: relative; 
    }
    .title-wrapper { 
        text-align: center; 
        background-image: var(--title-bg-img); 
        background-size: cover; 
        background-position: center;
        padding: 20px 40px; 
        border-radius: var(--border-radius); 
        position: relative;
        width: 100%;
        max-width: 350px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .title-wrapper::before { 
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(255,255,255,0.7); border-radius: var(--border-radius); 
    }
    .header-title {
        font-size: 28px; color: #333; margin: 0; font-weight: 500;
        letter-spacing: 2px; position: relative; z-index: 2; font-family: var(--font-main);
    }
    .date-display { font-size: 12px; color: #666; margin: 5px 0 0; position: relative; z-index: 2; letter-spacing: 1px; }

    /* 顶部装饰 */
    .deco-img {
        display: block; width: 100%; height: 15px;
        background-image: var(--deco-img); background-size: contain; background-repeat: repeat-x;
        margin: 10px 0; position: relative; z-index: 2;
    }

    /* ================= 切换栏（按钮图片+文字标注） ================= */
    .nav-tabs { display: flex; gap: 10px; padding: 0 15px 15px; flex-wrap: wrap; position: relative; z-index: 2; }
    .nav-tab {
        flex: 1; text-align: center; padding: 12px 10px; font-size: 14px;
        background: none; border: none; cursor: pointer; color: #555;
        background-image: var(--btn-blank); background-size: 100% 100%; 
        background-repeat: no-repeat; transition: all 0.3s ease;
        position: relative;
    }
    /* 选中时变成灰暗色，字体白色（加阴影防看不清） */
    .nav-tab.active { 
        filter: grayscale(100%) brightness(0.6); 
        color: #ffffff !important; 
        font-weight: bold; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
    }

    /* ================= 窗口卡片（全宽） ================= */
    .window-card {
        background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px);
        margin: 0 15px 20px; padding: 0; border-radius: var(--border-radius);
        box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        border: 1px solid rgba(255,255,255,0.8); position: relative; overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        z-index: 2;
    }
    .window-title-bar {
        padding: 12px 20px; font-size: 12px; color: #888; 
        border-bottom: 1px solid rgba(0,0,0,0.05);
        display: flex; justify-content: space-between; align-items: center;
    }
    .window-title-bar .dots { display: flex; gap: 6px; }
    .window-title-bar .dots span { width: 8px; height: 8px; border-radius: 50%; background: #f8c8d4; }
    .window-body { padding: 20px; }

    /* 编辑器内部 */
    .editor-card textarea { 
        width: 100%; border: none; resize: none; font-size: 15px; 
        font-family: var(--font-main); 
        outline: none; min-height: 80px; color: #333; 
        padding: 10px; background: rgba(255,255,255,0.5); border-radius: 10px;
    }
    .input-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; align-items: center; }
    .input-row input[type="text"] { 
        flex: 1; border: 1px solid #eee; border-radius: 10px; padding: 10px; 
        font-size: 13px; outline: none; background: rgba(255,255,255,0.7); width: 100%;
        font-family: var(--font-main);
    }
    .input-row input[type="file"] { font-size: 12px; width: 100%; color: #888; }
    
    /* 标签输入与按钮 */
    .tag-input-row { display: flex; gap: 10px; margin-top: 15px; }
    .tag-input-row input { 
        flex: 1; border: 1px solid #eee; border-radius: 10px; padding: 10px; 
        font-size: 13px; outline: none; background: rgba(255,255,255,0.7);
        font-family: var(--font-main);
    }
    .tag-input-row button { 
        background: none; border: none; 
        background-image: var(--btn-blue); background-size: 100% 100%; 
        width: 80px; height: 40px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    
    /* 选中标签 */
    .selected-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .selected-tag { 
        background: rgba(248, 200, 212, 0.2); padding: 4px 12px; border-radius: 20px; 
        font-size: 12px; color: #d98a9a; display: flex; align-items: center; gap: 6px; 
    }
    .selected-tag button { background: none; border: none; color: #d98a9a; cursor: pointer; font-size: 14px; }
    
    /* 记录按钮（使用粉色按钮图片+文字） */
    .editor-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
    .btn { 
        border: none; padding: 0; cursor: pointer; transition: 0.3s; 
        background: none; background-image: var(--btn-pink); background-size: 100% 100%; 
        width: 120px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .btn:hover { opacity: 0.8; }
    .btn:disabled { opacity: 0.4; }

    /* 日期过滤器 */
    .date-filter { padding: 0 15px 15px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; z-index: 2; position: relative; }
    .date-filter input[type="date"] { 
        border: 1px solid #f8c8d4; border-radius: 12px; padding: 8px 15px; 
        font-size: 13px; font-family: inherit; background: rgba(255,255,255,0.8); outline: none; 
        font-family: var(--font-main);
    }
    .date-filter button { 
        background: none; border: none; font-size: 13px; color: #d98a9a; font-weight: bold; cursor: pointer; 
    }

    /* ================= 侧边栏 ================= */
    .sidebar {
        position: fixed; top: 0; left: 0; width: 280px; height: 100vh;
        background: rgba(255, 255, 255, 0.9); 
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        border-right: 1px solid rgba(255,255,255,0.5);
        padding: 30px 20px; overflow-y: auto; z-index: 2000;
        transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 4px 0 30px rgba(0,0,0,0.05);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .sidebar h2 { font-size: 18px; margin: 0; font-weight: 600; color: #555; }
    .close-sidebar { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
    
    /* 头像框：移除手机图片，改成默认圆框可上传 */
    .avatar-wrapper { text-align: center; margin-bottom: 20px; }
    .avatar {
        width: 80px; height: 80px; border-radius: 50%; 
        margin: 0 auto; display: flex; align-items: center; justify-content: center;
        background: #f0f0f0; border: 2px dashed #f8c8d4;
        cursor: pointer; overflow: hidden; position: relative;
    }
    .avatar-inner { width: 100%; height: 100%; object-fit: cover; display: none; }
    .avatar-text { color: #aaa; font-size: 12px; }
    .avatar-upload { display: none; }

    /* 侧边栏标签（使用按钮图片，底部黑色文字标注） */
    .tag-list { list-style: none; padding: 0; margin: 0; }
    .tag-list li {
        padding: 15px 15px 10px; margin-bottom: 18px; 
        font-size: 14px; color: #555; cursor: pointer; 
        position: relative; border-radius: 12px;
        background-image: var(--btn-blank); background-size: 100% 100%; background-repeat: no-repeat;
        display: flex; flex-direction: column; justify-content: flex-end; min-height: 55px;
        transition: all 0.3s ease;
    }
    /* 深色文字标注在左下角 */
    .tag-list li .folder-label {
        font-size: 12px; font-weight: bold; color: #333; opacity: 0.9;
        margin-top: auto; /* 推到底部 */
    }
    .tag-list li:hover { transform: translateX(4px); }
    .tag-list li.active { 
        filter: grayscale(100%) brightness(0.6); /* 选中变灰 */
    }
    .tag-list li.active .folder-label { color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

    /* 日期索引 */
    .date-index-section { margin-top: 20px; }
    .date-index-section h3 { font-size: 14px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .date-picker-input {
        width: 100%; padding: 10px; border: 1px solid #f8c8d4; border-radius: 12px;
        font-family: inherit; font-size: 14px; outline: none; background: #fff;
    }

    /* 遮罩层 */
    .overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.2); backdrop-filter: blur(4px); z-index: 1500; 
        display: none; opacity: 0; transition: opacity 0.3s;
    }
    .overlay.open { display: block; opacity: 1; }

    /* ================= 笔记列表 ================= */
    .note-list { padding: 0 15px; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 2; }
    .note-card {
        background-color: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.8); border-radius: var(--border-radius);
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        position: relative; overflow: hidden; transition: transform 0.3s;
        background-size: cover; background-position: center;
    }
    .note-card:hover { transform: translateY(-2px); }
    
    .card-text-short { background-image: var(--card-text-short); }
    .card-text-long { background-image: var(--card-text-long); }
    .card-text-big { background-image: var(--card-text-big); }
    .card-img-1 { background-image: var(--card-img-1); }
    .card-img-3 { background-image: var(--card-img-3); }
    .card-img-6 { background-image: var(--card-img-6); }
    .card-img-only { background-image: var(--card-img-only); }

    .note-card .note-title-bar {
        padding: 12px 20px; font-size: 11px; color: #999; 
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px dashed rgba(0,0,0,0.05);
    }
    .note-card .note-body { padding: 15px 20px; }
    .note-date { font-size: 11px; color: #aaa; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .note-tags { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .note-tag { background: rgba(248, 200, 212, 0.2); padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #d98a9a; }
    .note-content { font-size: 15px; line-height: 1.7; white-space: pre-wrap; margin-bottom: 12px; color: #333; font-family: var(--font-main); }
    .note-media { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid rgba(0,0,0,0.05); }
    .note-link { display: inline-block; margin-top: 10px; font-size: 13px; color: #d98a9a; text-decoration: underline; word-break: break-all; }
    
    /* 卡片底部操作按钮：使用 btn-no, btn-yes 图片，并加上文字 */
    .note-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(0,0,0,0.05); }
    .note-actions button { font-size: 12px; padding: 0; border: none; cursor: pointer; transition: 0.3s; background: none; background-size: 100% 100%; 
        display: flex; align-items: center; justify-content: center;
        font-weight: bold; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .btn-danger { background-image: var(--btn-no); width: 80px; height: 32px; } 
    .btn-restore { background-image: var(--btn-yes); width: 80px; height: 32px; } 
    .btn-danger:hover, .btn-restore:hover { opacity: 0.8; }

    /* ================= 垃圾桶 ================= */
    .trash-container {
        background-image: var(--trash-bg); background-size: cover; background-position: center;
        margin: 20px 15px; border-radius: 30px; padding: 30px 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        border: 2px solid #f8c8d4;
    }

    /* ================= 设置弹窗 ================= */
    .settings-modal {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); z-index: 3000; 
        display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .settings-modal.open { display: flex; }
    .settings-content {
        background: rgba(255,255,255,0.95); border: 1px solid #f8c8d4; border-radius: var(--border-radius);
        width: 100%; max-width: 400px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .settings-content h3 { margin: 0 0 20px 0; color: #333; font-size: 18px; font-weight: 500; }
    .settings-content label { font-size: 13px; color: #888; display: block; margin-bottom: 8px; }
    .settings-content input[type="file"] { font-size: 12px; width: 100%; margin-bottom: 20px; color: #888; }
    .settings-content input[type="text"] { 
        width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 8px; 
        margin-bottom: 20px; font-size: 13px; outline: none; background: rgba(255,255,255,0.8);
        font-family: var(--font-main);
    }
    /* 设置里的三个按钮，也都使用按钮图片 */
    .settings-content .btn { width: 100%; margin-top: 10px; background-image: var(--btn-pink); }
    .settings-content .btn-grey { background-image: var(--btn-grey); }
    .settings-content .btn-reset { background-image: var(--btn-blue); }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<!-- 侧边栏 -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>INDEX</h2>
        <button class="close-sidebar" id="close-sidebar">×</button>
    </div>
    
    <div class="avatar-wrapper">
        <div class="avatar" id="avatar-img" onclick="document.getElementById('avatar-upload').click()">
            <img src="" alt="" class="avatar-inner" id="avatar-inner">
            <span class="avatar-text" id="avatar-text">点击上传头像</span>
        </div>
        <input type="file" id="avatar-upload" class="avatar-upload" accept="image/*">
    </div>

    <ul class="tag-list" id="tag-list">
        <!-- 文件夹样式通过JS渲染 -->
    </ul>

    <div class="date-index-section">
        <h3>📅 日期索引</h3>
        <input type="date" class="date-picker-input" id="sidebar-date-picker">
    </div>

    <div style="margin-top: 20px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px;">
        <button class="btn btn-grey" style="width:100%; margin-bottom:10px;" onclick="openSettings()">⚙️ 网站设置</button>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="settings-modal" id="settings-modal">
    <div class="settings-content">
        <h3>⚙️ 设置</h3>
        <label>上传自定义背景图</label>
        <input type="file" id="bg-upload" accept="image/*">
        <label>背景图片链接（用于分享）</label>
        <input type="text" id="bg-url-input" placeholder="https://example.com/bg.jpg">
        <button class="btn" onclick="saveBgFromUrl()">保存背景</button>
        <button class="btn btn-reset" onclick="resetBackground()">恢复默认背景</button>
        <button class="btn btn-grey" onclick="closeSettings()">关闭</button>
    </div>
</div>

<!-- 顶部 -->
<div class="top-header">
    <button class="menu-btn" id="menu-btn" style="position: absolute; left: 15px; top: 20px; background: none; border: none; font-size: 24px; cursor: pointer;">☰</button>
    <div class="title-wrapper" onclick="openSettings()">
        <h1 class="header-title">Malb♡r☆</h1>
        <p class="date-display" id="date-display"></p>
    </div>
</div>

<!-- 装饰图 -->
<div class="deco-img"></div>

<!-- 切换栏 -->
<div class="nav-tabs">
    <div class="nav-tab active" id="tab-notes">📝 笔记</div>
    <div class="nav-tab" id="tab-trash">🗑️ 垃圾桶</div>
    <div class="nav-tab" id="tab-settings">⚙️ 设置</div>
</div>

<!-- 编辑器 -->
<div class="window-card" id="editor-card">
    <div class="window-title-bar">
        <span>NEW ENTRY</span>
        <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div class="window-body">
        <textarea id="note-content" placeholder="记录你的灵感和废话吧..."></textarea>
        <div class="input-row">
            <input type="text" id="note-link" placeholder="添加链接（选填）">
        </div>
        <div class="input-row">
            <input type="file" id="note-media" accept="image/*,video/*,.pdf,.doc,.docx,.txt">
            <span id="file-name" style="font-size:12px; color:#888;"></span>
        </div>

        <div class="tag-input-row">
            <input type="text" id="tag-input" placeholder="输入标签，回车添加">
            <button id="add-tag-btn">添加</button>
        </div>
        <div class="selected-tags" id="selected-tags"></div>

        <div class="editor-actions">
            <button class="btn" id="save-btn">记录一下 ♡</button>
        </div>
    </div>
</div>

<!-- 日期过滤 -->
<div class="date-filter">
    <input type="date" id="filter-date">
    <button id="clear-date">显示全部</button>
</div>

<!-- 笔记列表 -->
<div class="note-list" id="note-list"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= 1. Supabase 初始化 ================= */
const SUPABASE_URL = "https://zpsbdymlofvzyskymagh.supabase.co";
const SUPABASE_KEY = "sb_publishable_6jazDy0kesZQBPSBaY77Rg_qMTM6Hze";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= 2. 状态变量 ================= */
let notes = [];
let currentTag = 'all';
let currentView = 'notes';
let selectedDate = '';
let pendingTags = [];

/* ================= 3. 侧边栏逻辑 ================= */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
document.getElementById('menu-btn').onclick = openSidebar;
document.getElementById('close-sidebar').onclick = closeSidebar;
overlay.onclick = closeSidebar;

// 用户头像上传
document.getElementById('avatar-upload').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById('avatar-inner').src = ev.target.result;
            document.getElementById('avatar-inner').style.display = 'block';
            document.getElementById('avatar-text').style.display = 'none';
            localStorage.setItem('userAvatar', ev.target.result);
        };
        reader.readAsDataURL(file);
    }
};
// 加载头像
const savedAvatar = localStorage.getItem('userAvatar');
if (savedAvatar) {
    document.getElementById('avatar-inner').src = savedAvatar;
    document.getElementById('avatar-inner').style.display = 'block';
    document.getElementById('avatar-text').style.display = 'none';
}

// 日期显示
const today = new Date();
document.getElementById('date-display').textContent = `${today.getFullYear()} / ${today.getMonth()+1} / ${today.getDate()}`;

/* ================= 4. 背景设置与恢复默认 ================= */
function loadBackground() {
    const savedBg = localStorage.getItem('customBg');
    if (savedBg) {
        document.body.style.backgroundImage = `url('${savedBg}')`;
    }
}
loadBackground();

function openSettings() { document.getElementById('settings-modal').classList.add('open'); document.getElementById('bg-url-input').value = localStorage.getItem('customBg') || ''; }
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }

document.getElementById('bg-upload').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const base64 = ev.target.result;
        localStorage.setItem('customBg', base64);
        document.body.style.backgroundImage = `url('${base64}')`;
        alert("背景已保存到本地！");
    };
    reader.readAsDataURL(file);
};

function saveBgFromUrl() {
    const url = document.getElementById('bg-url-input').value.trim();
    if (url) { localStorage.setItem('customBg', url); document.body.style.backgroundImage = `url('${url}')`; alert("背景已保存！"); closeSettings(); }
    else { alert("请输入图片链接"); }
}

function resetBackground() {
    localStorage.removeItem('customBg');
    document.body.style.backgroundImage = ''; 
    alert("已恢复为系统默认背景！");
    closeSettings();
}

/* ================= 5. 标签与视图切换逻辑 ================= */
function renderPendingTags() {
    const box = document.getElementById('selected-tags');
    box.innerHTML = pendingTags.map((t, i) => `<span class="selected-tag">${escapeHTML(t)} <button onclick="removePendingTag(${i})">×</button></span>`).join("");
}
function removePendingTag(index) { pendingTags.splice(index, 1); renderPendingTags(); }
function addPendingTag() {
    const input = document.getElementById('tag-input');
    const tag = input.value.trim();
    if (tag && !pendingTags.includes(tag)) { pendingTags.push(tag); renderPendingTags(); }
    input.value = '';
}
document.getElementById('add-tag-btn').onclick = addPendingTag;
document.getElementById('tag-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addPendingTag(); } });

document.getElementById('note-media').onchange = (e) => {
    const file = e.target.files[0];
    if (file) document.getElementById('file-name').textContent = file.name;
};

function switchView(view) {
    currentView = view;
    if (view === 'notes') {
        document.getElementById('tab-notes').classList.add('active');
        document.getElementById('tab-trash').classList.remove('active');
        document.getElementById('tab-settings').classList.remove('active');
        document.getElementById('editor-card').style.display = 'block';
        document.querySelector('.date-filter').style.display = 'flex';
    } else if (view === 'trash') {
        document.getElementById('tab-notes').classList.remove('active');
        document.getElementById('tab-trash').classList.add('active');
        document.getElementById('tab-settings').classList.remove('active');
        document.getElementById('editor-card').style.display = 'none';
        document.querySelector('.date-filter').style.display = 'none';
    } else if (view === 'settings') {
        document.getElementById('tab-notes').classList.remove('active');
        document.getElementById('tab-trash').classList.remove('active');
        document.getElementById('tab-settings').classList.add('active');
        document.getElementById('editor-card').style.display = 'none';
        document.querySelector('.date-filter').style.display = 'none';
        openSettings();
        return;
    }
    renderNotes();
}
document.getElementById('tab-notes').onclick = () => switchView('notes');
document.getElementById('tab-trash').onclick = () => switchView('trash');
document.getElementById('tab-settings').onclick = () => switchView('settings');

// 日期过滤
document.getElementById('filter-date').onchange = (e) => { selectedDate = e.target.value; renderNotes(); };
document.getElementById('clear-date').onclick = () => { document.getElementById('filter-date').value = ''; selectedDate = ''; renderNotes(); };
document.getElementById('sidebar-date-picker').onchange = (e) => { 
    selectedDate = e.target.value; 
    document.getElementById('filter-date').value = selectedDate; 
    renderNotes(); 
    closeSidebar(); 
};

/* ================= 6. 数据加载与渲染 ================= */
async function loadNotes() {
    const { data, error } = await supabaseClient.from('notes').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    notes = data || [];
    renderSidebarTags();
    renderNotes();
}

function renderSidebarTags() {
    const list = document.getElementById('tag-list');
    const allTags = new Set();
    notes.forEach(n => { if (n.tags && !n.deleted) n.tags.split(',').forEach(t => allTags.add(t.trim())); });
    
    // 使用按钮图片作为底，添加文字标注
    let html = `<li class="tag-item ${currentTag === 'all' ? 'active' : ''}" data-tag="all"><span class="folder-label">📚 全部记录</span></li>`;
    allTags.forEach(tag => { 
        html += `<li class="tag-item ${currentTag === tag ? 'active' : ''}" data-tag="${tag}"><span class="folder-label">🏷️ ${escapeHTML(tag)}</span></li>`; 
    });
    list.innerHTML = html;
    
    document.querySelectorAll('.tag-item').forEach(item => {
        item.onclick = () => { currentTag = item.dataset.tag; renderSidebarTags(); renderNotes(); closeSidebar(); };
    });
}

function renderNotes() {
    const list = document.getElementById('note-list');
    let filtered = notes.filter(n => n.deleted === (currentView === 'trash'));
    if (selectedDate) filtered = filtered.filter(n => n.date === selectedDate);
    if (currentTag !== 'all') filtered = filtered.filter(n => n.tags && n.tags.split(',').map(t => t.trim()).includes(currentTag));

    if (currentView === 'trash') {
        list.className = 'note-list trash-container';
    } else {
        list.className = 'note-list';
    }

    if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-tip">${currentView === 'notes' ? '这里空空的，写点什么吧 ♡' : '垃圾桶是空的 🗑️'}</div>`;
        return;
    }

    list.innerHTML = filtered.map(n => {
        let mediaHtml = '';
        if (n.media_url) {
            if (n.media_type === 'image') mediaHtml = `<img src="${n.media_url}" class="note-media" />`;
            else if (n.media_type === 'video') mediaHtml = `<video src="${n.media_url}" controls class="note-media"></video>`;
            else mediaHtml = `<a href="${n.media_url}" target="_blank" class="note-link">📎 查看附件：${escapeHTML(n.media_url.split('/').pop())}</a>`;
        }
        let linkHtml = n.link_url ? `<a href="${n.link_url}" target="_blank" class="note-link">🔗 ${escapeHTML(n.link_url)}</a>` : '';

        let cardClass = 'note-card';
        const contentLength = n.content ? n.content.length : 0;
        const hasMedia = !!n.media_url;
        
        if (hasMedia && !n.content) {
            cardClass += ' card-img-only';
        } else if (hasMedia && n.media_type === 'image') {
            cardClass += ' card-img-1';
        } else if (contentLength > 50) {
            cardClass += ' card-text-big';
        } else if (contentLength > 0) {
            cardClass += ' card-text-short';
        } else {
            cardClass += ' card-text-long';
        }

        return `
            <div class="${cardClass}">
                <div class="note-title-bar">
                    <span>${escapeHTML(n.title || 'UNTITLED')}</span>
                    <div class="dots"><span></span><span></span><span></span></div>
                </div>
                <div class="note-body">
                    <div class="note-date">
                        <span>📅 ${n.date}</span>
                        <span>${new Date(n.created_at).toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                    <div class="note-tags">
                        ${n.tags ? n.tags.split(',').map(t => `<span class="note-tag">#${escapeHTML(t.trim())}</span>`).join('') : ''}
                    </div>
                    <div class="note-content">${escapeHTML(n.content)}</div>
                    ${mediaHtml}
                    ${linkHtml}
                    <div class="note-actions">
                        ${currentView === 'notes' 
                            ? `<button class="btn-danger" onclick="moveToTrash('${n.id}')">移入</button>`
                            : `<button class="btn-restore" onclick="restoreNote('${n.id}')">恢复</button>
                               <button class="btn-danger" onclick="deletePermanently('${n.id}')">删除</button>`
                        }
                    </div>
                </div>
            </div>
        `;
    }).join("");
}

function escapeHTML(text) { return String(text || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ================= 7. 保存与删除逻辑 ================= */
document.getElementById('save-btn').onclick = async function() {
    const content = document.getElementById('note-content').value.trim();
    const link = document.getElementById('note-link').value.trim();
    const fileInput = document.getElementById('note-media');
    const file = fileInput.files[0];

    if (!content && !file && !link) return alert("写点什么或者加个文件吧 ♡");

    this.disabled = true; this.textContent = "保存中...";

    let mediaUrl = null, mediaType = null;
    if (file) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { error: uploadError } = await supabaseClient.storage.from('note-media').upload(fileName, file);
        if (uploadError) { alert("文件上传失败：" + uploadError.message); this.disabled = false; this.textContent = "记录一下 ♡"; return; }
        const { data: urlData } = supabaseClient.storage.from('note-media').getPublicUrl(fileName);
        mediaUrl = urlData.publicUrl;
        if (file.type.startsWith('image/')) mediaType = 'image';
        else if (file.type.startsWith('video/')) mediaType = 'video';
        else mediaType = 'file';
    }

    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];
    const tagsStr = pendingTags.join(',');
    const title = content.substring(0, 15) + (content.length > 15 ? '...' : '');

    const { error } = await supabaseClient.from('notes').insert({
        id: Date.now().toString(36), date: dateStr, content: content,
        media_url: mediaUrl, media_type: mediaType, link_url: link,
        tags: tagsStr, title: title, deleted: false
    });

    if (error) { alert("保存失败：" + error.message); } 
    else {
        document.getElementById('note-content').value = '';
        document.getElementById('note-link').value = '';
        fileInput.value = '';
        document.getElementById('file-name').textContent = '';
        pendingTags = []; renderPendingTags();
        await loadNotes();
    }
    this.disabled = false; this.textContent = "记录一下 ♡";
};

async function moveToTrash(id) { if (!confirm("移入垃圾桶？")) return; await supabaseClient.from('notes').update({ deleted: true }).eq('id', id); await loadNotes(); }
async function restoreNote(id) { await supabaseClient.from('notes').update({ deleted: false }).eq('id', id); await loadNotes(); }
async function deletePermanently(id) { if (!confirm("彻底删除？不可恢复！")) return; await supabaseClient.from('notes').delete().eq('id', id); await loadNotes(); }

/* ================= 初始化 ================= */
loadNotes();
</script>
</body>
</html>
